# ============================================================
# 组织列表 system.org_list —— 全量断言模板（紧凑格式）
# 覆盖 10 种断言类型；作为项目内其他接口用例的断言参考模板
# 注：迁移自历史别名 orgList.get_orgList（path / method 保持完全一致）
