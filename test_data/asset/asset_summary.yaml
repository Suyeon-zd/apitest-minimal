# test_data/asset/asset_summary.yaml
# ============================================================
# 组织列表 system.org_list —— 断言类型模板（每种类型一条示例）
#
# 断言分层原则：
#   契约层（schema）    字段存在 + 类型 + 嵌套结构，一条顶几十条 exists/field_type
#   业务层（code）      接口是否成功
#   语义层（list_len / each / contains）数据本身是否符合业务含义
#
# 单字段的 exists / field_type 只在两种情况下写：
#   1. null 值字段（schema 对 null 不约束类型）
#   2. 该字段有独立业务含义，需要单独失败定位
# ============================================================

- api_name: "orgList - 默认查询（断言类型模板）"
  api: system.org_list
  payload: "parentId=0&type=org"
  markers: [smoke, p0]
  assert:
    # ---------- HTTP 层 ----------
    - {type: status_code, expected: 200}
    - {type: header, field: "Content-Type", operator: "contains", expected: "application/json"}

    # ---------- 业务层：成功信号 ----------
    - {type: json_path, path: "code", expected: 200}
    # 文案可能微调，用 contains 而不是精确相等，避免无意义的红灯
    - {type: contains, path: "msg", expected: "成功"}

    # ---------- 契约层：一条断言覆盖全部字段的存在性与类型 ----------
    - {type: schema, schema_file: "gen_system_org_list.json"}

    # ---------- 语义层：数据本身是否合理 ----------
    - {type: list_len, path: "data", operator: "gte", expected: 1}
    - {type: each, path: "data", field: "type", expected: "org"}

    # ---------- 单字段精确断言（只用于稳定且有业务含义的值） ----------
    - {type: json_path, path: "data.0.parentId", expected: 0}

    # ---------- null 字段：schema 不约束 null 的类型，必须成对断言 ----------
    # 单独用 json_path expected: null 是恒真的（字段被删除也会通过），不要这么写
    - {type: exists, path: "data.0.parentName", expected: true}
    - {type: field_type, path: "data.0.parentName", expected: "null"}

    # ---------- 性能 SLA（有明确要求时再加） ----------
    - {type: response_time, operator: "lte", expected: 2}
