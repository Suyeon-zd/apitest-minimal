# api/endpoints.yaml - 接口注册中心（接口路径的唯一事实来源）
#
# 组织方式：按业务模块分组，引用 key = "模块.接口名"，如 asset.dev_type_distribution
# 用例 YAML 中写 api: asset.dev_type_distribution，不再写死 method/path；
# 后端改路径只需改本文件一处，所有用例自动生效。
#
# 每个接口支持字段：
#   method:    必填，HTTP 方法（GET/POST/PUT/DELETE）
#   path:      必填，接口路径（自动拼接 base_url；支持 ${var} 运行时变量，如 /asset/${asset_id}）
#   headers:   可选，该接口专属请求头（如签名/加密头），与全局 Authorization 头自动合并；
#              值支持 ${ENV_VAR} 环境变量插值（.env / CI 注入）
#   body_type: 可选，仅对非 GET 请求生效：json（默认，application/json）/
#              data（原始文本如加密串，或 dict 表单 application/x-www-form-urlencoded）

