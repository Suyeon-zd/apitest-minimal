[pytest]
# 只从 testcases/ 收集测试代码（用例数据在 test_data/，由 test_regression.py 自行扫描），
# 避免全盘递归扫描 data/、output/ 等目录带来的额外开销与误收集
testpaths = testcases
# addopts 用 -q（dot 进度，CI 标准）而不是 -v：让 pytest --collect-only 输出简洁的
# node::id 形式（无 <Dir>/<Module>/<Class>/<Function> 标签），CI 与本地默认简洁。
# 需要看详细 Function 列表 / 每个 test 的 PASSED 标记时手加 pytest -v。
addopts = -q --html=output/reports/report.html --self-contained-html --alluredir=output/reports/allure-results --clean-alluredir
markers =
    smoke: 冒烟用例（核心链路，CI 每次构建执行，对应 pytest -m smoke）
    regression: 全量回归用例
    p0: P0 最高优先级用例
    p1: P1 高优先级用例
    auto: 自动生成的用例（tools/gen_cases.py 产出，区别于手写用例）

# ---- 控制台实时日志 ----
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S