[pytest]
# 只从 testcases/ 收集测试代码（用例数据在 test_data/，由 test_regression.py 自行扫描），
# 避免全盘递归扫描 data/、output/ 等目录带来的额外开销与误收集。
# 框架自检在 selftest/，不在 testpaths 内：需要时显式执行 python -m pytest selftest。
testpaths = testcases
# addopts 用 -q（dot 进度）而不是 -v：让 pytest --collect-only 输出简洁的
# node::id 形式（无 <Dir>/<Module>/<Class>/<Function> 标签）。
# 需要看详细 Function 列表 / 每个测试的 PASSED 标记时手加 pytest -v。
#
# -p plugins.loader 是唯一硬编码的积木入口：装载器读 plugins.yaml 清单加载全部积木。
# 启停积木请改 plugins.yaml（注释对应行即拔出），勿在此增删 -p；
# 临时禁用用环境变量 APITEST_PLUGINS_OFF（见 README 第 6 节）。
addopts =
    -q
    -p plugins.loader
markers =
    smoke: 冒烟用例（核心链路，对应 pytest -m smoke）
    regression: 全量回归用例
    p0: P0 最高优先级用例
    p1: P1 高优先级用例
    auto: 自动生成的用例（plugins/casegen 产出，区别于手写用例）
    skip: 自动生成的骨架用例（缺 payload/危险接口），补完后删除该标记

# ---- 控制台实时日志 ----
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S